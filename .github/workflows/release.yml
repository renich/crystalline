name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  macos:
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Install Crystal
        env:
          HOMEBREW_NO_INSTALL_UPGRADE: 1
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
        run: brew update && brew install crystal || true
      - name: Install dependencies
        run: shards install --production --ignore-crystal-version
      - name: Build the binary
        run: |
          LLVM_DEP="$(brew deps --installed crystal 2>/dev/null | grep -E '^llvm(@[0-9]+)?$' | head -n 1)"
          if [ -n "$LLVM_DEP" ] && [ -x "$(brew --prefix "$LLVM_DEP")/bin/llvm-config" ]; then
            export LLVM_CONFIG="$(brew --prefix "$LLVM_DEP")/bin/llvm-config"
          elif [ -x "$(brew --prefix llvm 2>/dev/null)/bin/llvm-config" ]; then
            export LLVM_CONFIG="$(brew --prefix llvm)/bin/llvm-config"
          else
            export LLVM_CONFIG="$(ls -d $(brew --prefix)/opt/llvm*/bin/llvm-config 2>/dev/null | sort -V | tail -n 1)"
          fi
          echo "Using LLVM_CONFIG: $LLVM_CONFIG"
          export PATH="$(dirname "$LLVM_CONFIG"):$PATH"
          shards build crystalline --release --no-debug --stats --progress --ignore-crystal-version
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crystalline_${{ matrix.arch }}-apple-darwin
          path: ./bin/crystalline
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2
      - name: Build the static binary
        run: podman build -t crystalline -f Containerfile .
      - name: Copy binary to host
        run: |
          podman run -v $PWD:/app/host:z --rm crystalline:latest cp ./bin/crystalline ./host/crystalline
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: crystalline_x86_64-unknown-linux-musl
          path: ./crystalline
  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: ./artifacts
      - name: Compress and rename artifacts
        run: |
          gzip -r ./artifacts
          mv ./artifacts/crystalline_x86_64-unknown-linux-musl/crystalline.gz ./artifacts/crystalline_x86_64-unknown-linux-musl.gz
          mv ./artifacts/crystalline_x86_64-apple-darwin/crystalline.gz ./artifacts/crystalline_x86_64-apple-darwin.gz
          mv ./artifacts/crystalline_arm64-apple-darwin/crystalline.gz ./artifacts/crystalline_arm64-apple-darwin.gz
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: |
            ./artifacts/crystalline_x86_64-unknown-linux-musl.gz
            ./artifacts/crystalline_x86_64-apple-darwin.gz
            ./artifacts/crystalline_arm64-apple-darwin.gz
